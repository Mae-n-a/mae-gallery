# Cloudflare Worker config — deploys the static Astro build + the contact API.
# Deploy with:  npm run deploy   (alias for `wrangler deploy`)
# Local dev:    npm run cf-dev   (serves the built site + Worker via wrangler)

name = "mae-gallery"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Serve the Astro build output. Matching files are returned before the Worker
# runs; the Worker handles /api/contact and any unmatched path.
[assets]
directory = "./dist"
binding = "ASSETS"

# Where contact-form enquiries are emailed, and the sender address.
# CONTACT_TO must be a VERIFIED Email Routing destination address.
# CONTACT_FROM must be on a domain that has Email Routing enabled.
[vars]
CONTACT_TO = "hello@mae.gallery"
CONTACT_FROM = "noreply@mae.gallery"

# --- NATIVE EMAIL SENDING (enable once you have a custom domain) -------------
# `send_email` works through Cloudflare Email Routing, which requires a real
# domain on your Cloudflare account (it can't run on *.workers.dev). To turn it
# on:
#   1. Add your domain to Cloudflare and enable Email Routing.
#   2. Verify your inbox as a destination address.
#   3. Set `destination_address` below to that verified inbox, uncomment, and
#      redeploy. (Also point CONTACT_TO / CONTACT_FROM at your domain above.)
#
# [[send_email]]
# name = "SEB"
# destination_address = "you@your-real-domain.com"
# ----------------------------------------------------------------------------
